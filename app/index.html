<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; object-src 'none'"><title>G4T0XX Modmenu</title><link rel="stylesheet" href="style.css"></head><body>
<header><strong>G4T0XX <span>/ MODMENU</span></strong><span>Biblioteca local de jogos e mods</span></header>
<main><section class="hero"><div><p class="eyebrow">Seu jogo. Sua configuração.</p><h1>Mods sob seu controle.</h1><p>Importe pastas de mods, ative com backup e restaure os arquivos originais.</p></div><button id="add" class="primary" disabled>Adicionar jogo</button></section>
<div id="error" role="alert" hidden></div><p id="status" role="status">Abrindo biblioteca…</p>
<div class="workspace"><aside><h2>Seus jogos</h2><label for="search">Buscar jogo</label><div class="search"><input id="search" type="search" placeholder="Nome do jogo"><button id="clear" aria-label="Limpar busca" hidden disabled>×</button></div><div id="games"></div></aside><section class="mods-panel"><div class="section-title"><div><h2 id="game-name">Escolha um jogo</h2><p id="game-path"></p></div><div class="actions"><button id="launch" disabled>Iniciar jogo</button><button id="import" class="primary" disabled>Importar mod</button><button id="remove-game" disabled>Remover jogo</button></div></div><div id="mods"></div></section></div></main>
<footer>Biblioteca local · Backups automáticos · Seus arquivos sob controle.</footer>
<dialog id="confirm" aria-labelledby="confirm-title"><h2 id="confirm-title"></h2><p id="confirm-body"></p><div class="actions"><button id="cancel" autofocus disabled>Cancelar</button><button id="accept" class="primary" disabled>Confirmar</button></div></dialog>
<script src="renderer.js"></script></body></html>
